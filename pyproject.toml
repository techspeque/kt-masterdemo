[project]
name = "kt-masterdemo"
version = "0.0.0"
description = "End-to-end demo of kt-masterlog + kt-masterviz, installed from PyPI. Not published."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Adam" }]

# These pull the actual published artifacts from PyPI — this repo's whole
# point is to validate the released packages, so source installs are
# deliberately not used.
dependencies = [
    "kt-masterlog>=0.2.0",
    "kt-masterviz>=0.1.0",
]

[dependency-groups]
# Only needed when re-recording the demo GIF via scripts/record_demo.sh.
# Runtime usage doesn't require these.
dev = [
    "playwright>=1.40",
    "pillow>=10.0",
]

# No build backend — this isn't a publishable package. uv treats it as a
# project that just manages a venv + dependency lock.
